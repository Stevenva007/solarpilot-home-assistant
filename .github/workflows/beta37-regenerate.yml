name: Beta37 Regenerate

on:
  push:
    branches:
      - beta37-work
    paths:
      - ".github/workflows/beta37-regenerate.yml"
      - "custom_components/solar_pilot/current_guide.py"
      - "custom_components/solar_pilot/config_flow.py"
      - "custom_components/solar_pilot/thermal_climate.py"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: beta37-work
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regenerate release-bound docs
        run: python tools/update_current_explanation.py
      - name: Commit generated files when changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACTUELE_WERKING.md custom_components/solar_pilot/docs/ACTUELE_WERKING.md custom_components/solar_pilot/frontend/option-help.json
          git commit -m "beta.37: regenerate release documentation [skip ci]"
          git push origin HEAD:beta37-work
