name: Sync beta36 generated docs

on:
  push:
    branches:
      - "release/beta.36"
    paths:
      - "custom_components/solar_pilot/current_guide.py"
      - ".github/workflows/sync-beta36-generated.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Regenerate current explanation
        run: python tools/update_current_explanation.py
      - name: Commit generated documentation
        shell: bash
        run: |
          if git diff --quiet -- docs/ACTUELE_WERKING.md custom_components/solar_pilot/docs/ACTUELE_WERKING.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACTUELE_WERKING.md custom_components/solar_pilot/docs/ACTUELE_WERKING.md
          git commit -m "beta36: regenerate current explanation"
          git push
