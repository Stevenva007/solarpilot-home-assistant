name: Manual Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Bestaande versie-tag, bijvoorbeeld v1.0.0-beta.40"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public repository privacy/structure
        run: python tools/check_public_repository.py
      - name: Handoff dossier consistency
        run: python tools/check_handoff.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/solar_pilot
      - name: Verify requested tag
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null
      - name: Create GitHub release when missing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} bestaat al; niets gewijzigd."
            exit 0
          fi
          extra=()
          if [[ "${TAG}" == *beta* || "${TAG}" == *alpha* || "${TAG}" == *rc* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${TAG}" --generate-notes --verify-tag "${extra[@]}"
