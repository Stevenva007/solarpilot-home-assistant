name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public repository privacy/structure
        run: python tools/check_public_repository.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Validate Python syntax
        run: python -m compileall -q custom_components/solar_pilot
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          extra=()
          if [[ "${GITHUB_REF_NAME}" == *beta* || "${GITHUB_REF_NAME}" == *alpha* || "${GITHUB_REF_NAME}" == *rc* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag "${extra[@]}"
