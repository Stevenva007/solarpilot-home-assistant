name: Apply reviewed recovery fix
on:
  push:
    branches: [fix/device-isolated-recovery-beta104]
    paths: [.github/workflows/recovery-source-snapshot.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: fix/device-isolated-recovery-beta104
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply reviewed source and release notes
        run: |
          test "$(python -c 'import json; print(json.load(open("custom_components/solar_pilot/manifest.json"))["version"])')" = '1.0.0-beta.103'
          python -B .github/beta104_patch.py
          python -B .github/beta104_release.py
          python -B tools/update_current_explanation.py
          echo '243c4d34abc148dce6429ff9d0fde234518e8f0cc2a46e345330b4178ddcdd44  custom_components/solar_pilot/runtime.py' | sha256sum -c -
          echo '2c3eacf91a1cd0e76ed6831a0cebb589c25468347debc53309439cc2fac6a4c2  custom_components/solar_pilot/frontend/solar-pilot-card.js' | sha256sum -c -
          echo '3dd9148364537330d99a83072c67e38fc866c3fd52d95f01e4442b81094dec00  tests/test_nonblocking_review104.py' | sha256sum -c -
          rm .github/beta104_patch.py .github/beta104_release.py .github/workflows/recovery-source-snapshot.yml
      - name: Validate source boundaries and documentation
        run: |
          python -B tools/check_public_repository.py
          python -B tools/check_handoff.py
          python -B tools/check_current_explanation.py
          python -B tools/check_sg_boundary.py
      - name: Install declared test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Reproduce focused regression result
        run: python -B -m pytest -q -p no:cacheprovider tests/test_nonblocking_review104.py tests/test_source_wait52.py tests/test_device_retry90.py tests/test_device_retry_audit90.py tests/test_source_wait_ui52.py tests/test_isolation_ui53.py tests/test_runtime.py tests/test_restart_mode58.py
      - name: Commit exact source to isolated branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: beta104 isolate source waits from fault review and preserve true command guards'
          git push origin HEAD:refs/heads/fix/device-isolated-recovery-beta104
