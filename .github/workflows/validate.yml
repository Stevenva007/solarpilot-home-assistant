name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public repository privacy/structure
        run: python tools/check_public_repository.py
      - name: Handoff dossier consistency
        env:
          HANDOFF_BASE: ${{ github.event.before }}
          HANDOFF_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HANDOFF_HEAD: ${{ github.sha }}
        run: python tools/check_handoff.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Python syntax
        run: python -m compileall -q custom_components/solar_pilot

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
