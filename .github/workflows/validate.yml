name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public repository privacy/structure
        run: python tools/check_public_repository.py
      - name: Handoff dossier consistency
        env:
          HANDOFF_BASE: ${{ github.event.before }}
          HANDOFF_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HANDOFF_HEAD: ${{ github.sha }}
        run: python tools/check_handoff.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Verify current upstream source review
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/check_upstream_review.py
      - name: Panasonic read-only / SG command boundary
        run: python tools/check_sg_boundary.py
      - name: Validate publisher failure gates with fictitious native commands
        shell: pwsh
        run: ./tools/check_audit_publisher79.ps1
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Python syntax
        run: python -m compileall -q custom_components/solar_pilot

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  frontend-browser:
    name: Warmtepomp browser validation
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install browser test runner
        run: python -m pip install playwright==1.63.0 -r requirements-dev.txt
      - name: Install isolated Chromium test browser
        run: python -m playwright install chromium
      - name: Build self-contained preview from this exact release
        run: python -B tools/build_example.py
      - name: Validate warmtepomp states and mobile layout with fictitious data
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_heatpump_overview65.py
      - name: Preserve the existing consumer history popup
        run: python tools/check_consumer_history_ui.py "${{ runner.temp }}/solarpilot-browser-tests"
      - name: Validate heat pump history, task and SG separation with fictitious data
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_heatpump_history70.py
      - name: Validate temporary SG controls and start cloud grace with fictitious data
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_sg_ui.py
      - name: Validate central priority movement and external SG takeover countdown
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_priority_external_ui106.py
      - name: Validate timed Wallbox priority, individual overrides and countdowns
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_wallbox_priority_ui88.py
      - name: Validate flexible solar allocation and protected dishwasher reserve
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_cycle_reserve_ui89.py
      - name: Validate device recovery waits, global Auto and mobile status
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_device_retry_ui90.py
      - name: Validate analysis waits, PV cohorts, SG stop evidence and display goals
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_analysis_ui91.py
      - name: Validate PV factor evidence and quarter profile with fictitious data
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_pv_ui33.py
      - name: Validate dishwasher deadline and consumed request with fictitious data
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_dishwasher_deadline78.py
      - name: Validate audit expiry, popup lifecycle and release constructors
        run: python tools/check_audit_ui79.py
      - name: Validate SG cooling diagnostics, source expiry and settings routes
        env:
          SOLARPILOT_SCREENSHOT_DIR: ${{ runner.temp }}/solarpilot-browser-tests
        run: python tools/check_cooling_ui80.py
      - name: Validate read-only water history, source links and mobile gestures
        run: python tools/check_water_ui101.py "${{ runner.temp }}/solarpilot-browser-tests"
      - name: Validate water detector coverage and rolling boiler comparisons
        run: python tools/check_water_ui102.py "${{ runner.temp }}/solarpilot-browser-tests"
      - name: Validate both current heat pump task source contracts and mobile labels
        run: python tools/check_heatpump_status_ui103.py "${{ runner.temp }}/solarpilot-browser-tests"
      - name: Retain fictitious browser validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warmtepomp-browser-validation
          path: ${{ runner.temp }}/solarpilot-browser-tests
          if-no-files-found: ignore

  real-ha-startup:
    name: Real Home Assistant startup
    runs-on: ubuntu-24.04
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14.2"
      - name: Install the supported Home Assistant Core
        run: python -m pip install homeassistant==2026.10.0
      - name: Install actual Core frontend and Shelly dependencies
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          import homeassistant
          core_root = pathlib.Path(homeassistant.__file__).parent
          requirements = []
          for component in ("frontend", "shelly"):
              manifest = json.loads((core_root / "components" / component / "manifest.json").read_text())
              requirements.extend(manifest.get("requirements", []))
          subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Prepare the immutable beta.62 regression fixture
        run: git worktree add --detach "${RUNNER_TEMP}/solarpilot-beta62-fixture" v1.0.0-beta.62
      - name: Reproduce beta.62 startup failure without altering its configuration
        run: python tools/check_real_ha_startup.py --source-root "${RUNNER_TEMP}/solarpilot-beta62-fixture" --expect-mappingproxy-failure
      - name: Verify production setup, platforms, reload and unload
        run: python tools/check_real_ha_startup.py
      - name: Validate optional source clearing against actual Core schemas
        run: python tools/check_audit_config_schema79.py
      - name: Verify immutable current general SG configuration and split read-only sources
        run: python tools/check_real_ha_startup.py --current-sg-fixture

  publish:
    name: Publish new version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repository-checks
      - validate-hacs
      - hassfest
      - frontend-browser
      - real-ha-startup
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read SolarPilot version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/solar_pilot/manifest.json", encoding="utf-8"))["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether version is already published
        id: existing
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release packages
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          hacs="SolarPilot-v${version}-GitHub-HACS.zip"
          local="SolarPilot-v${version}-local.zip"
          git archive --format=zip --output="${hacs}" HEAD
          python - <<'PY'
          import os, subprocess, zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          root=Path('.')
          out=Path(f'SolarPilot-v{version}-local.zip')
          paths=subprocess.check_output(['git','ls-tree','-rz','--full-tree','HEAD','custom_components/solar_pilot']).split(b'\0')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for row in paths:
                  if not row:
                      continue
                  metadata,raw_path=row.split(b'\t',1)
                  mode,kind,blob=metadata.split()
                  rel=Path(raw_path.decode())
                  if kind!=b'blob' or {'__pycache__','.pytest_cache','userfiles'} & set(rel.parts):
                      continue
                  info=zipfile.ZipInfo(rel.as_posix(),date_time=(1980,1,1,0,0,0))
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=0o100644 << 16
                  body=subprocess.check_output(['git','cat-file','blob',blob.decode()])
                  z.writestr(info,body,compresslevel=9)
          PY
          echo "hacs=${hacs}" >> "${GITHUB_OUTPUT}"
          echo "local=${local}" >> "${GITHUB_OUTPUT}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Verify exact source and four release assets before upload
        env:
          HACS_PACKAGE: ${{ steps.package.outputs.hacs }}
          LOCAL_PACKAGE: ${{ steps.package.outputs.local }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python tools/check_release_packages.py \
            --source-ref HEAD --expected-sha "${SOURCE_SHA}" \
            --hacs "${HACS_PACKAGE}" --local "${LOCAL_PACKAGE}"

      - name: Create tag and GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HACS_PACKAGE: ${{ steps.package.outputs.hacs }}
          LOCAL_PACKAGE: ${{ steps.package.outputs.local }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "SolarPilot ${VERSION}"
          git push origin "${TAG}"

          assets=("${HACS_PACKAGE}" "${LOCAL_PACKAGE}")
          release_label="$(printf '%s' "${VERSION##*-}" | tr '[:lower:]' '[:upper:]' | tr -d '.')"
          [[ -f "docs/${release_label}_INSTELLEN.md" ]] && assets+=("docs/${release_label}_INSTELLEN.md")
          [[ -f "docs/TESTRESULTATEN_${release_label}.md" ]] && assets+=("docs/TESTRESULTATEN_${release_label}.md")

          extra=()
          if [[ "${TAG}" == *beta* || "${TAG}" == *alpha* || "${TAG}" == *rc* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${TAG}" --title "SolarPilot ${TAG}" --generate-notes --verify-tag "${extra[@]}" "${assets[@]}"

      - name: Download and verify published four assets against the exact tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_SHA: ${{ github.sha }}
          HACS_PACKAGE: ${{ steps.package.outputs.hacs }}
          LOCAL_PACKAGE: ${{ steps.package.outputs.local }}
        run: |
          release_download_dir="$(mktemp -d)"
          release_label="$(printf '%s' "${VERSION##*-}" | tr '[:lower:]' '[:upper:]' | tr -d '.')"
          gh release download "${TAG}" --dir "${release_download_dir}" \
            --pattern "${HACS_PACKAGE}" --pattern "${LOCAL_PACKAGE}" \
            --pattern "${release_label}_INSTELLEN.md" \
            --pattern "TESTRESULTATEN_${release_label}.md"
          python tools/check_release_packages.py \
            --source-ref "${TAG}" --expected-sha "${SOURCE_SHA}" \
            --hacs "${HACS_PACKAGE}" --local "${LOCAL_PACKAGE}" \
            --download-dir "${release_download_dir}"

      - name: Version already published
        if: steps.existing.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} bestaat al; vier bestaande assets en exacte bron-SHA opnieuw gecontroleerd. Geen bestanden overschreven."
