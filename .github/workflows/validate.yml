name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  repository-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Public repository privacy/structure
        run: python tools/check_public_repository.py
      - name: Handoff dossier consistency
        env:
          HANDOFF_BASE: ${{ github.event.before }}
          HANDOFF_PR_BASE: ${{ github.event.pull_request.base.sha }}
          HANDOFF_HEAD: ${{ github.sha }}
        run: python tools/check_handoff.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full test suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider
      - name: Python syntax
        run: python -m compileall -q custom_components/solar_pilot

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master

  publish:
    name: Publish new version
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - repository-checks
      - validate-hacs
      - hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Read SolarPilot version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import json; print(json.load(open("custom_components/solar_pilot/manifest.json", encoding="utf-8"))["version"])')"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Check whether version is already published
        id: existing
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Create release packages
        if: steps.existing.outputs.exists != 'true'
        id: package
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          hacs="SolarPilot-v${version}-GitHub-HACS.zip"
          local="SolarPilot-v${version}-local.zip"
          git archive --format=zip --output="${hacs}" HEAD
          python - <<'PY'
          import os, zipfile
          from pathlib import Path
          version=os.environ['VERSION']
          root=Path('.')
          out=Path(f'SolarPilot-v{version}-local.zip')
          base=root/'custom_components'/'solar_pilot'
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(base.rglob('*')):
                  rel=p.relative_to(root)
                  if p.is_dir() or '__pycache__' in rel.parts or 'userfiles' in rel.parts:
                      continue
                  z.write(p,rel.as_posix())
          PY
          echo "hacs=${hacs}" >> "${GITHUB_OUTPUT}"
          echo "local=${local}" >> "${GITHUB_OUTPUT}"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create tag and GitHub prerelease
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          HACS_PACKAGE: ${{ steps.package.outputs.hacs }}
          LOCAL_PACKAGE: ${{ steps.package.outputs.local }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "SolarPilot ${VERSION}"
          git push origin "${TAG}"

          assets=("${HACS_PACKAGE}" "${LOCAL_PACKAGE}")
          release_label="$(printf '%s' "${VERSION##*-}" | tr '[:lower:]' '[:upper:]' | tr -d '.')"
          [[ -f "docs/${release_label}_INSTELLEN.md" ]] && assets+=("docs/${release_label}_INSTELLEN.md")
          [[ -f "docs/TESTRESULTATEN_${release_label}.md" ]] && assets+=("docs/TESTRESULTATEN_${release_label}.md")

          extra=()
          if [[ "${TAG}" == *beta* || "${TAG}" == *alpha* || "${TAG}" == *rc* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "${TAG}" --title "SolarPilot ${TAG}" --generate-notes --verify-tag "${extra[@]}" "${assets[@]}"

      - name: Version already published
        if: steps.existing.outputs.exists == 'true'
        run: echo "Tag ${{ steps.version.outputs.tag }} bestaat al; publicatie overgeslagen."
