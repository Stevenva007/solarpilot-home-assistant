name: Beta36 finalizer

on:
  push:
    branches:
      - "release/beta.36"
    paths:
      - ".github/workflows/beta36-finalize.yml"

permissions:
  contents: write

jobs:
  quality:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/beta.36
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Generate release-bound documentation and help
        run: python tools/update_current_explanation.py
      - name: Public repository privacy and structure
        run: python tools/check_public_repository.py
      - name: Release/documentation consistency
        run: python tools/check_current_explanation.py
      - name: Repository structure
        run: python tools/validate_repository.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Full pytest suite
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        shell: bash
        run: |
          mkdir -p dist
          set -o pipefail
          python -m pytest -q -p no:cacheprovider | tee dist/pytest-beta36.txt
      - name: Python syntax
        run: python -m compileall -q custom_components/solar_pilot
      - name: Diff whitespace
        run: git -c core.autocrlf=false diff --check
      - name: Build local and GitHub/HACS ZIPs
        shell: bash
        run: |
          rm -rf dist/local dist/repo
          mkdir -p dist/local/custom_components dist/repo
          cp -a custom_components/solar_pilot dist/local/custom_components/solar_pilot
          (cd dist/local && zip -qr ../SolarPilot-v1.0.0-beta.36-local.zip .)

          rsync -a ./ dist/repo/ \
            --exclude='.git/' \
            --exclude='dist/' \
            --exclude='__pycache__/' \
            --exclude='.pytest_cache/' \
            --exclude='custom_components/solar_pilot/userfiles/'
          (cd dist/repo && zip -qr ../SolarPilot-v1.0.0-beta.36-GitHub-HACS.zip .)
          test -s dist/SolarPilot-v1.0.0-beta.36-local.zip
          test -s dist/SolarPilot-v1.0.0-beta.36-GitHub-HACS.zip
      - name: Commit generated release files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ACTUELE_WERKING.md \
                  custom_components/solar_pilot/docs/ACTUELE_WERKING.md \
                  custom_components/solar_pilot/frontend/option-help.json \
                  custom_components/solar_pilot/translations/nl.json
          if ! git diff --cached --quiet; then
            git commit -m "beta36: regenerate release-bound documentation [generated]"
            git push origin HEAD:release/beta.36
          fi
      - name: Upload beta36 packages and test report
        uses: actions/upload-artifact@v4
        with:
          name: SolarPilot-v1.0.0-beta.36-packages
          path: |
            dist/SolarPilot-v1.0.0-beta.36-local.zip
            dist/SolarPilot-v1.0.0-beta.36-GitHub-HACS.zip
            dist/pytest-beta36.txt
          if-no-files-found: error
          retention-days: 14

  hacs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/beta.36
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: release/beta.36
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
