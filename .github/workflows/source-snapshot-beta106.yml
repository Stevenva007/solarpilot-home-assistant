name: Pinned source snapshot
on:
  push:
    branches: [fix/sg-adoption-priority-beta106]
    paths: [.github/workflows/source-snapshot-beta106.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e88b2091302a1bd6af0fdf7154f152bb7dda8ecb
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=zip --output=source-beta105.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: source-beta105-e88b209
          path: source-beta105.zip
          retention-days: 7
