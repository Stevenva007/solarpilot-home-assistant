name: Pinned source snapshot
on:
  push:
    branches: [fix/sg-adoption-priority-beta106]
    paths: [.github/workflows/source-snapshot-beta106.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: e88b2091302a1bd6af0fdf7154f152bb7dda8ecb
          persist-credentials: false
      - name: Download exact offline test dependency
        run: |
          python -m pip download --no-deps --only-binary=:all: voluptuous==0.16.0 -d wheels
      - uses: actions/upload-artifact@v4
        with:
          name: beta106-offline-test-dependency
          path: wheels/*.whl
          retention-days: 7
