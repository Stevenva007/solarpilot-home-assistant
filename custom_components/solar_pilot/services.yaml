set_climate_setting:
  name: Klimaatinstelling wijzigen
  description: Wijzig één SolarPilot-klimaatinstelling vanuit Home Assistant. De waarde wordt gevalideerd, direct toegepast en blijvend opgeslagen.
  fields:
    config_entry_id:
      name: Configuratie-ID
      description: SolarPilot config entry. Mag leeg blijven als er maar één SolarPilot-configuratie is.
      required: false
      selector:
        text:
    setting:
      name: Instelling
      description: Interne sleutel van de klimaatinstelling. Gebruik normaal het SolarPilot-dashboard.
      required: true
      selector:
        text:
    value:
      name: Nieuwe waarde
      description: Nieuwe waarde. Het dashboard toont vóór opslaan uitleg, advies en gevolgen.
      required: true
      selector:
        object:

set_climate_override:
  name: Ruimte automatisch of handmatig bedienen
  description: Dashboardbediening per ruimte. Automatisch geeft de regeling terug aan SolarPilot; handmatig AUTO of UIT blijft gelden tot je op het dashboard terugkeert naar Automatisch. De gewone bron- en opdrachtcontrole blijft gelden.
  fields:
    config_entry_id:
      name: Configuratie-ID
      description: Mag leeg blijven als de ruimte bij precies één geladen SolarPilot-configuratie hoort.
      required: false
      selector:
        text:
    entity_id:
      name: Ruimte
      description: Een klimaatzone die bij SolarPilot is geselecteerd.
      required: true
      selector:
        entity:
          domain: climate
    mode:
      name: Bediening
      required: true
      selector:
        select:
          options:
            - label: Automatisch regelen
              value: "automatic"
            - label: Handmatig AUTO
              value: "auto"
            - label: Handmatig UIT
              value: "off"
            - label: Gemelde stand handmatig behouden
              value: "review"

set_planner_setting:
  name: Plannerinstelling wijzigen
  description: Wijzig één Unified Planner-instelling. Het dashboard toont uitleg, advies en gevolgen vóór opslaan.
  fields:
    config_entry_id:
      name: Configuratie-ID
      required: false
      selector:
        text:
    setting:
      name: Instelling
      required: true
      selector:
        text:
    value:
      name: Nieuwe waarde
      required: true
      selector:
        object:
